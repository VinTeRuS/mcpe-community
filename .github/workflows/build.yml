name: Build

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential zlib1g-dev libpng-dev libopenal-dev

      - name: Configure CMake
        run: |
          mkdir -p build && cd build
          cmake ..

      - name: Build Server
        run: |
          cd build
          make -j$(nproc) MinecraftServer

      - name: Upload Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftServer-Linux
          path: build/MinecraftServer

  build-client:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential zlib1g-dev libpng-dev \
            libsdl2-dev libgl-dev libx11-dev libopenal-dev libegl-dev libxi-dev libxcursor-dev libglu1-mesa-dev

      - name: Build GLEW 2.3.0 from source (replace system GLEW)
        run: |
          sudo rm -f /usr/lib/x86_64-linux-gnu/libGLEW* /usr/lib/libGLEW* /usr/lib/libGLEW* 2>/dev/null
          sudo rm -f /usr/local/lib/libGLEW* /usr/local/include/GL/glew.h /usr/local/bin/glew-config 2>/dev/null
          cd /tmp
          curl -sL https://sourceforge.net/projects/glew/files/glew/2.3.0/glew-2.3.0.tgz/download -o glew.tgz
          tar -xzf glew.tgz
          cd glew-2.3.0
          make GLEW_PREFIX=/usr LIBDIR=/usr/lib/x86_64-linux-gnu
          sudo make GLEW_PREFIX=/usr LIBDIR=/usr/lib/x86_64-linux-gnu install
          sudo ldconfig
          ls -la /usr/lib/x86_64-linux-gnu/libGLEW*

      - name: Create GL header symlinks
        run: |
          sudo ln -sf /usr/include/GL /usr/include/gl
          sudo ln -sf /usr/include/GL/gl.h /usr/include/gl/GL.h
          sudo ln -sf /usr/include/AL /usr/include/OpenAL
          ls -la /usr/include/gl/
          ls -la /usr/include/OpenAL/

      - name: Configure CMake
        run: |
          rm -rf build
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH=/usr/local:/usr

      - name: Verify GLEW version
        run: |
          ls -la /usr/local/lib/libGLEW* 2>/dev/null || echo "No GLEW in /usr/local"
          /usr/local/bin/glew-config --libs 2>/dev/null || echo "glew-config failed"
          /usr/local/bin/glew-config --cflags 2>/dev/null || echo "glew-config cflags failed"
          strings /usr/local/lib/libGLEW.so.2.3 2>/dev/null | head -5 || echo "strings check failed"

      - name: Build Client
        run: |
          cd build
          make -j$(nproc) MinecraftClient

      - name: Verify binary dependencies
        run: |
          objdump -p build/MinecraftClient 2>/dev/null | grep -i glew || echo "No GLEW in binary"

      - name: Upload Client Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftClient-Linux
          path: build/MinecraftClient

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ${{github.workspace}}
    steps:
      - uses: actions/checkout@v4

      - name: Clone vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          .\bootstrap-vcpkg.bat

      - name: Install vcpkg dependencies
        run: |
          .\vcpkg\vcpkg.exe install libpng:x64-windows zlib:x64-windows

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v1.0.2

      - name: Copy vcpkg includes to project lib
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\lib\include"
          Copy-Item -Recurse "${{ github.workspace }}\vcpkg\installed\x64-windows\include\*" "${{ github.workspace }}\lib\include\"
          Copy-Item -Recurse "${{ github.workspace }}\vcpkg\installed\x64-windows\lib\*" "${{ github.workspace }}\lib\lib\"

      - name: Restore NuGet packages
        run: nuget restore ./project/win32/MinecraftWin32.sln

      - name: Build
        run: msbuild /m /p:Configuration=Minecraft /p:Platform=x64 ./project/win32/MinecraftWin32.sln

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Windows
          path: project/win32/dist/Minecraft.Windows.CE.exe
