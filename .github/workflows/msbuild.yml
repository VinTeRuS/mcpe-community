name: MSBuild

on:
  workflow_dispatch: 
  push:
    branches: [ "arm64-build" ]
  pull_request:
    branches: [ "arm64-build" ]

env:
  SOLUTION_FILE_PATH: ./project/win32/MinecraftWin32.sln
  BUILD_CONFIGURATION: Minecraft

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: ${{ github.workspace }}/vcpkg
        vcpkgGitCommitISH: 5e47e5e6c7c2e6a3e8a5e47e5e6c7c2e6a3e8a5e47

    - name: Install vcpkg dependencies
      run: |
        .\vcpkg\vcpkg.exe install libpng:x64-windows zlib:x64-windows

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.0.2

    - name: Copy vcpkg includes to project lib
      run: |
        New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\lib\include"
        Copy-Item -Recurse "${{ github.workspace }}\vcpkg\installed\x64-windows\include\*" "${{ github.workspace }}\lib\include\"

    - name: Restore NuGet packages
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform=x64 ${{env.SOLUTION_FILE_PATH}}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Minecraft-Windows
        path: project/win32/dist/Minecraft.Windows.CE.exe


  build-server:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y zlib1g-dev libpng-dev libopenal-dev cmake build-essential ccache

    - name: Setup Cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-

    - name: Configure CMake
      run: |
        mkdir build && cd build
        cmake -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache ..

    - name: Build Server
      run: |
        export CCACHE_DIR=~/.cache/ccache
        cd build
        make -j$(nproc) MinecraftServer

    - name: Upload Server Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MinecraftServer-Linux
        path: build/MinecraftServer
