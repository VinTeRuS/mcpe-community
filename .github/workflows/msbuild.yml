# documentation.

name: MSBuild

on:
  workflow_dispatch: 
  push:
    branches: [ "arm64-build" ]
  pull_request:
    branches: [ "arm64-build" ]

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: ./project/win32/MinecraftWin32.sln

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Minecraft

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.0.2

    - name: Restore NuGet packages
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{env.SOLUTION_FILE_PATH}}
    
    # - name: Copy Libraries
    #   working-directory: ${{env.GITHUB_WORKSPACE}}
    #   run: copy libraries\bin\*.dll project\win32\dist\

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Minecraft-Windows
        path: project/win32/dist/Minecraft.Windows.CE.exe


  build-server:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y zlib1g-dev ccache

    - name: Setup Cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-

    - name: Configure CMake
      run: |
        mkdir build && cd build
        cmake -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache ..

    - name: Build Server
      run: |
        export CCACHE_DIR=~/.cache/ccache
        cd build
        make -j$(nproc) MinecraftServer

    - name: Upload Server Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MinecraftServer-Linux
        path: build/MinecraftServer
